<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    {% seo %}
    <script defer src="https://cloud.umami.is/script.js" data-website-id="1fe88801-a37f-415e-aad4-67877b9e0c63" data-domains="raulsofia.github.io"></script>
    <script>
      (function() {
        const checkUmami = () => {
          const url = new URL(window.location);
          const fromParam = url.searchParams.get('from');

          if (fromParam) {
            if (window.umami && typeof window.umami.track === 'function') {
              window.umami.track((props) => ({
                ...props,
                referrer: `https://${fromParam}.source`
              }));

              url.searchParams.delete('from');
              window.history.replaceState({}, document.title, url.pathname + url.search);
            } else {
              setTimeout(checkUmami, 50);
            }
          }
        };

        checkUmami();
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.generated.css' | relative_url }}">
  </head>
  <body class="bg-background text-on-background font-body selection:bg-primary selection:text-on-primary" data-mode="connect">
    <div class="fixed inset-0 grid-pattern pointer-events-none"></div>
    <nav class="fixed top-0 w-full z-50 bg-[#061423]/60 backdrop-blur-xl bg-gradient-to-b from-[#061423] to-transparent">
      <div class="flex justify-between items-center px-4 py-4 md:px-8 md:py-6 max-w-7xl mx-auto">
        <a href="{{ '/' | relative_url }}" class="text-xl font-bold tracking-tighter text-slate-100 font-headline hover:text-primary transition-colors">Raul Sofia</a>
        <div class="flex items-center gap-3 md:gap-5 text-[10px] md:text-xs uppercase tracking-[0.2em]">
          <a class="nav-link{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
          <a class="nav-link{% if page.url contains '/posts' %} active{% endif %}" href="{{ '/posts/' | relative_url }}">Posts</a>
          <a class="nav-link{% if page.url contains '/research' %} active{% endif %}" href="{{ '/research/' | relative_url }}">Research</a>
          <a class="nav-link{% if page.url contains '/about' %} active{% endif %}" href="{{ '/about/' | relative_url }}">About</a>
        </div>
      </div>
    </nav>
    <main class="relative min-h-screen flex flex-col items-center justify-start px-6 overflow-hidden pt-16 md:items-center md:justify-center md:pt-20">
      <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
      {{ content }}
    </main>
    <footer class="w-full py-12 bg-transparent">
      <div class="flex flex-col md:flex-row justify-between items-center px-8 max-w-7xl mx-auto gap-6 md:gap-0">
        <div class="flex flex-col items-center md:items-start">
          <span class="text-slate-200 font-semibold font-headline tracking-tight">Raul Sofia</span>
          <span class="font-['Inter'] text-[10px] tracking-[0.2em] uppercase text-slate-500 mt-1">© 2026. Built by Raul Sofia.</span>
        </div>
        <div class="flex items-center gap-10">
          <a class="font-['Inter'] text-xs tracking-widest uppercase text-slate-500 hover:text-slate-100 transition-colors" href="https://github.com/RaulSofia">GitHub</a>
          <a class="font-['Inter'] text-xs tracking-widest uppercase text-slate-500 hover:text-slate-100 transition-colors" href="https://www.linkedin.com/in/raul-sofia/">LinkedIn</a>
          <a class="font-['Inter'] text-xs tracking-widest uppercase text-slate-500 hover:text-slate-100 transition-colors" href="https://scholar.google.com/citations?user=ERxgLK4AAAAJ" rel="noopener" target="_blank">Google Scholar</a>
        </div>
      </div>
    </footer>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const track = document.querySelector('.slider-track');
        const slides = document.querySelectorAll('.slide');
        const prev = document.querySelector('.slider-prev');
        const next = document.querySelector('.slider-next');
        const dots = document.querySelectorAll('.slider-dot');

        if (!track || slides.length === 0) return;

        let index = 0;
        let autoplayPausedUntil = 0;
        let touchStartX = 0;
        let touchStartY = 0;

        function render() {
          track.style.transform = `translateX(-${index * 100}%)`;
          dots.forEach((dot, dotIndex) => {
            dot.classList.toggle('active', dotIndex === index);
          });
        }

        function pauseAutoplay() {
          autoplayPausedUntil = Date.now() + 15000;
        }

        function moveTo(nextIndex) {
          index = (nextIndex + slides.length) % slides.length;
          pauseAutoplay();
          render();
        }

        prev && prev.addEventListener('click', function () {
          moveTo(index - 1);
        });

        next && next.addEventListener('click', function () {
          moveTo(index + 1);
        });

        dots.forEach((dot, dotIndex) => {
          dot.addEventListener('click', function () {
            moveTo(dotIndex);
          });
        });

        track.addEventListener('touchstart', function (event) {
          const touch = event.changedTouches[0];
          touchStartX = touch.clientX;
          touchStartY = touch.clientY;
        }, { passive: true });

        track.addEventListener('touchend', function (event) {
          const touch = event.changedTouches[0];
          const deltaX = touch.clientX - touchStartX;
          const deltaY = touch.clientY - touchStartY;

          if (Math.abs(deltaX) < 40 || Math.abs(deltaX) <= Math.abs(deltaY)) return;
          moveTo(index + (deltaX < 0 ? 1 : -1));
        }, { passive: true });

        setInterval(function () {
          if (Date.now() < autoplayPausedUntil) return;
          index = (index + 1) % slides.length;
          render();
        }, 6000);
      });
    </script>
  </body>
</html>
