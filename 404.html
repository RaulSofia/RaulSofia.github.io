---
layout: default
permalink: /404.html
title: Page Not Found
---

<section class="max-w-3xl w-full z-10 text-left">
  <div class="page-card rounded-2xl p-8 md:p-12">
    <p class="text-xs uppercase tracking-[0.35em] text-primary/80 mb-5">Error 404</p>
    <h1 class="font-headline text-4xl md:text-6xl font-bold tracking-tighter text-on-surface leading-tight">Whoops...</h1>
    <p class="mt-6 max-w-2xl text-on-surface-variant text-base md:text-lg leading-relaxed">The page you are looking for does not exist or may have moved.</p>

    <a class="mt-8 inline-flex items-center gap-2 text-sm font-semibold text-primary hover:text-cyan-300 transition-colors" href="{{ '/' | relative_url }}">
      <span class="material-symbols-outlined text-[18px]">arrow_back</span>
      Return home
    </a>

    <div class="mt-6 border-t border-outline-variant/20 pt-8">
      <h2 class="font-headline text-xl font-bold text-on-surface">Were you looking for one of these?</h2>
      <p class="mt-2 text-sm text-on-surface-variant">Closest matches for <code id="missing-path" class="text-primary"></code></p>
      <div id="similar-results" class="mt-5 grid gap-3" aria-live="polite"></div>
    </div>

  </div>
</section>

<script>
  const suggestions = [
    {% for post in site.posts %}
    {
      title: {{ post.title | jsonify }},
      url: {{ post.url | relative_url | jsonify }},
      searchText: {{ post.title | append: " " | append: post.categories | append: " " | append: post.url | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  const missingPath = window.location.pathname;
  const queryTokens = missingPath.toLowerCase().split(/[^a-z0-9]+/).filter((token) => token.length > 1);
  const scoredSuggestions = suggestions.map((suggestion, suggestionIndex) => {
    const searchText = suggestion.searchText.toLowerCase();
    const score = queryTokens.reduce((total, token) => {
      if (searchText.includes(token)) return total + 3;
      return total;
    }, 0) + (suggestions.length - suggestionIndex) / 100;

    return { ...suggestion, score };
  });

  scoredSuggestions.sort((firstSuggestion, secondSuggestion) => secondSuggestion.score - firstSuggestion.score);

  document.getElementById('missing-path').textContent = missingPath;
  const resultsContainer = document.getElementById('similar-results');
  scoredSuggestions.slice(0, 3).forEach((suggestion) => {
    const resultLink = document.createElement('a');
    resultLink.href = suggestion.url;
    resultLink.className = 'group flex items-center justify-between gap-4 rounded-lg border border-outline-variant/20 bg-surface-container-low px-4 py-3 text-on-surface transition-colors hover:border-primary/50 hover:text-primary';
    resultLink.innerHTML = `<span class="font-headline font-bold">${suggestion.title}</span><span class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-x-1">arrow_forward</span>`;
    resultsContainer.appendChild(resultLink);
  });
</script>
